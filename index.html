<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SVT 5ᵉ — Le fonctionnement des êtres vivants</title>
<style>
/* ================================================================
   JETONS DE COULEUR
   ================================================================ */
:root{
  --bg:#EEF3F6; --bg2:#E3EBF0; --surface:#FFFFFF; --surface2:#F7FAFB;
  --ink:#16323F; --muted:#5D6F79; --line:#D8E2E8; --shadow:24 50 66;
  --rouge:#B03A2E; --orange:#D2691E; --teal:#1F7A6E; --bleu:#2E5C8A;
  --vert:#1E8449; --jaune:#D68910; --violet:#6C4A8F;
  --ok:#1E8449; --okbg:#E4F3EA; --ko:#C0392B; --kobg:#FBE9E7;
  --ring:#D2691E;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A21; --bg2:#13242D; --surface:#172A34; --surface2:#1D333E;
    --ink:#EAF2F6; --muted:#9FB3BD; --line:#2A4552; --shadow:0 0 0;
    --rouge:#E0705F; --orange:#F0954A; --teal:#48B9A8; --bleu:#6FA8DC;
    --vert:#5FC98A; --jaune:#F0B84A; --violet:#AE8AD6;
    --ok:#5FC98A; --okbg:#16362A; --ko:#E0705F; --kobg:#3A1E1B;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A21; --bg2:#13242D; --surface:#172A34; --surface2:#1D333E;
  --ink:#EAF2F6; --muted:#9FB3BD; --line:#2A4552; --shadow:0 0 0;
  --rouge:#E0705F; --orange:#F0954A; --teal:#48B9A8; --bleu:#6FA8DC;
  --vert:#5FC98A; --jaune:#F0B84A; --violet:#AE8AD6;
  --ok:#5FC98A; --okbg:#16362A; --ko:#E0705F; --kobg:#3A1E1B;
}

/* ================================================================
   BASE
   ================================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden}
img,svg{max-width:100%}
body{
  background:var(--bg);
  background-image:
    radial-gradient(1100px 600px at 12% -8%, color-mix(in srgb, var(--orange) 16%, transparent), transparent 60%),
    radial-gradient(900px 520px at 92% 4%, color-mix(in srgb, var(--teal) 15%, transparent), transparent 62%),
    radial-gradient(800px 500px at 50% 110%, color-mix(in srgb, var(--bleu) 12%, transparent), transparent 60%);
  color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-size:17px; line-height:1.55; min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:940px;margin:0 auto;padding:0 18px 90px}
h1,h2,h3{margin:0;line-height:1.2}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:12px}

/* ================================================================
   EN-TÊTE
   ================================================================ */
header{
  position:sticky;top:0;z-index:40;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  background:color-mix(in srgb, var(--bg) 78%, transparent);
  border-bottom:1px solid var(--line);
}
.bar{max-width:940px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:1;cursor:pointer;background:none}
.logo{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--orange),var(--rouge));box-shadow:0 6px 16px rgb(var(--shadow)/.22)}
.logo svg{width:22px;height:22px;fill:#fff}
.brand b{display:block;font-size:15px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icobtn{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--line);transition:transform .15s, background .2s}
.icobtn:hover{transform:translateY(-2px)}
.icobtn svg{width:19px;height:19px;fill:var(--muted)}
.xp{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px;white-space:nowrap}
.xp svg{width:16px;height:16px;fill:var(--jaune)}

/* ================================================================
   ACCUEIL
   ================================================================ */
.hero{padding:34px 0 8px;text-align:center;animation:rise .5s both}
.hero .kicker{display:inline-block;padding:5px 14px;border-radius:999px;font-size:12.5px;font-weight:800;
  letter-spacing:1.2px;text-transform:uppercase;color:#fff;background:linear-gradient(120deg,var(--rouge),var(--orange));
  box-shadow:0 8px 20px rgb(var(--shadow)/.2)}
.hero h1{margin:14px 0 8px;font-size:clamp(27px,5.4vw,43px);letter-spacing:-.6px}
.hero p{margin:0 auto;max-width:560px;color:var(--muted);font-size:15.5px}

.overall{margin:24px 0 6px;background:var(--surface);border:1px solid var(--line);border-radius:20px;
  padding:16px 18px;display:flex;align-items:center;gap:16px;box-shadow:0 10px 26px rgb(var(--shadow)/.07)}
.ring{width:62px;height:62px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .bgc{stroke:var(--line)}
.ring .fgc{stroke:url(#grad);transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px}
.overall .txt{flex:1;min-width:0}
.overall .txt b{display:block;font-size:15px}
.overall .txt span{font-size:13.5px;color:var(--muted)}

.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));margin-top:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;
  box-shadow:0 12px 30px rgb(var(--shadow)/.08);display:flex;flex-direction:column;animation:rise .5s both}
.card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.12s}
.card:nth-child(4){animation-delay:.18s}.card:nth-child(5){animation-delay:.24s}
.card .top{padding:16px 18px;color:#fff;display:flex;align-items:center;gap:12px}
.card .top svg{width:26px;height:26px;fill:#fff;flex:none;opacity:.95}
.card .top b{font-size:17px;display:block}
.card .top i{font-style:normal;font-size:12.5px;opacity:.88}
.card .body{padding:10px 12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.mod{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:14px;text-align:left;
  background:var(--surface2);border:1px solid transparent;transition:transform .15s,border-color .2s,background .2s;width:100%}
.mod:hover{transform:translateX(3px);border-color:var(--line)}
.mod .dot{width:26px;height:26px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:var(--line);font-size:13px;font-weight:800;color:var(--muted)}
.mod.done .dot{background:var(--ok);color:#fff}
.mod .lbl{flex:1;min-width:0}
.mod .lbl b{display:block;font-size:14.5px;font-weight:650}
.mod .lbl span{font-size:12.5px;color:var(--muted)}
.mod .go{width:9px;height:9px;border-right:2.4px solid var(--muted);border-top:2.4px solid var(--muted);
  transform:rotate(45deg);flex:none;opacity:.55}
.score-pill{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--okbg);color:var(--ok)}

/* ================================================================
   VUE MODULE
   ================================================================ */
.mhead{display:flex;align-items:center;gap:12px;padding:22px 0 12px;animation:rise .4s both}
.back{width:40px;height:40px;border-radius:13px;background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;flex:none;transition:transform .15s}
.back:hover{transform:translateX(-3px)}
.back svg{width:18px;height:18px;fill:var(--muted)}
.mhead .t{flex:1;min-width:0}
.mhead .t b{display:block;font-size:19px}
.mhead .t span{font-size:13px;color:var(--muted)}
.steps{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:0 0 18px}
.steps i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--orange),var(--rouge));
  transition:width .45s cubic-bezier(.2,.8,.2,1)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;
  box-shadow:0 14px 34px rgb(var(--shadow)/.08);animation:pop .35s both}
.qnum{font-size:12.5px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--orange)}
.qtxt{margin:8px 0 18px;font-size:19.5px;font-weight:650;line-height:1.35}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;overflow-wrap:anywhere;border-radius:16px;text-align:left;
  background:var(--surface2);border:2px solid var(--line);transition:transform .14s,border-color .2s,background .2s}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--orange)}
.opt:disabled{cursor:default}
.opt .k{width:28px;height:28px;border-radius:9px;flex:none;display:grid;place-items:center;font-weight:800;
  font-size:13.5px;background:var(--line);color:var(--muted)}
.opt.good{border-color:var(--ok);background:var(--okbg)}
.opt.good .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--ko);background:var(--kobg);animation:shake .4s}
.opt.bad .k{background:var(--ko);color:#fff}

.feedback{margin-top:16px;padding:14px 16px;border-radius:16px;font-size:15px;display:none;animation:rise .3s both}
.feedback.show{display:block}
.feedback.ok{background:var(--okbg);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}
.feedback.ko{background:var(--kobg);border:1px solid color-mix(in srgb,var(--ko) 35%,transparent)}
.feedback b{display:block;margin-bottom:3px}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{padding:12px 20px;border-radius:14px;font-weight:700;font-size:15px;
  background:linear-gradient(120deg,var(--orange),var(--rouge));color:#fff;
  box-shadow:0 8px 20px rgb(var(--shadow)/.18);transition:transform .15s,filter .2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.45;pointer-events:none}

/* ---------- jeu de tri ---------- */
.pool{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:18px;min-height:46px}
.chip{padding:11px 15px;overflow-wrap:anywhere;border-radius:14px;background:var(--surface2);border:2px solid var(--line);
  font-size:15px;font-weight:600;transition:transform .14s,border-color .2s,background .2s;display:flex;align-items:center;gap:7px}
.chip:hover{transform:translateY(-2px)}
.chip.sel{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 14%,var(--surface));transform:translateY(-3px) scale(1.04)}
.chip.placed{opacity:.9}
.bins{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.bin{border-radius:20px;padding:12px;border:2px dashed var(--line);background:var(--surface2);min-height:120px;
  transition:border-color .2s,background .2s}
.bin.armed{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 9%,var(--surface2))}
.bin > b{display:block;font-size:14px;margin-bottom:9px;text-align:center}
.bin .items{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.bin .items .chip{font-size:13.5px;padding:7px 11px}
.chip.right{border-color:var(--ok);background:var(--okbg)}
.chip.wrong{border-color:var(--ko);background:var(--kobg)}

/* ---------- remise en ordre ---------- */
.order{display:grid;gap:10px}
.slotline{display:flex;align-items:center;gap:10px}
.slotnum{width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;font-weight:800;
  font-size:14px;background:var(--line);color:var(--muted)}
.slot{flex:1;min-height:48px;border-radius:14px;border:2px dashed var(--line);background:var(--surface2);
  display:flex;align-items:center;padding:0 14px;font-weight:600;color:var(--muted);font-size:15px}
.slot.filled{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ink)}

/* ---------- texte à trous ---------- */
.cloze{font-size:17px;line-height:2.25}
.blank{display:inline-block;min-width:112px;padding:2px 10px;margin:0 2px;border-bottom:2.5px solid var(--orange);
  text-align:center;font-weight:700;color:var(--orange);cursor:pointer;transition:background .2s}
.blank:hover{background:color-mix(in srgb,var(--orange) 12%,transparent)}
.blank.armed{background:color-mix(in srgb,var(--orange) 18%,transparent)}
.blank.right{border-color:var(--ok);color:var(--ok)}
.blank.wrong{border-color:var(--ko);color:var(--ko)}

/* ---------- cartes mémo ---------- */
.flashwrap{margin-bottom:16px}
.flash{position:relative;height:216px;cursor:pointer}
.face{position:absolute;inset:0;border-radius:22px;display:grid;place-items:center;text-align:center;
  padding:24px;border:1px solid var(--line);transition:opacity .34s ease, transform .34s ease}
.face.front{background:linear-gradient(140deg,var(--surface),var(--surface2))}
.face.back{background:linear-gradient(140deg,var(--teal),var(--bleu));color:#fff;border-color:transparent;
  opacity:0;transform:scale(.94);pointer-events:none}
.flash.turned .face.front{opacity:0;transform:scale(.94);pointer-events:none}
.flash.turned .face.back{opacity:1;transform:none;pointer-events:auto}
.face .mot{font-size:26px;font-weight:750;letter-spacing:-.4px}
.face .def{font-size:17.5px;line-height:1.45}
.face small{display:block;margin-top:12px;font-size:12.5px;opacity:.7}

/* ================================================================
   RÉSULTAT
   ================================================================ */
.result{text-align:center;animation:pop .4s both}
.medal{font-size:64px;line-height:1;margin-bottom:6px;animation:bounce .8s}
.result h2{font-size:27px;margin-bottom:6px}
.result p{color:var(--muted);margin:0 0 18px}
.bigscore{font-size:46px;font-weight:800;letter-spacing:-1.5px;
  background:linear-gradient(120deg,var(--orange),var(--rouge));-webkit-background-clip:text;background-clip:text;color:transparent}
.revue{margin-top:22px;text-align:left;display:grid;gap:8px}
.rev{padding:11px 14px;border-radius:14px;background:var(--surface2);border-left:4px solid var(--ok);font-size:14.5px}
.rev.ko{border-left-color:var(--ko)}
.rev b{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:2px}

/* ================================================================
   DIVERS
   ================================================================ */
.hint{font-size:13.5px;color:var(--muted);margin:0 0 14px}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:26px 0 10px}
canvas#conf{position:fixed;inset:0;pointer-events:none;z-index:60;display:none}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(5px)}50%{transform:translateX(-5px)}}
@keyframes bounce{0%{transform:scale(.4)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:760px){
  .bins{grid-template-columns:repeat(auto-fit,minmax(148px,1fr))}
}
@media (max-width:560px){
  body{font-size:16px}
  .wrap{padding:0 13px 80px}
  .panel{padding:16px;border-radius:20px}
  .qtxt{font-size:17.5px}
  .opt{padding:13px 13px}
  .chip{padding:11px 13px;font-size:14.5px}
  .cloze{font-size:16px;line-height:2.5}
  .blank{min-width:94px;padding:2px 7px}
  .flash{height:250px}
  .face .mot{font-size:23px}
  .face .def{font-size:16.5px}
  .hero h1{letter-spacing:-.3px}
  .overall{flex-wrap:wrap}
  .grid{grid-template-columns:1fr}
  .bar{padding:9px 13px;gap:9px}
  .xp{padding:6px 10px}
  .btn{padding:12px 17px;flex:1 1 auto;text-align:center}
}
@media (max-width:380px){
  .bins{grid-template-columns:1fr}
  .brand span span{display:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D2691E"/><stop offset="100%" stop-color="#B03A2E"/>
  </linearGradient>
</defs></svg>

<header>
  <div class="bar">
    <button class="brand" id="home-btn" aria-label="Retour à l’accueil">
      <span class="logo"><svg viewBox="0 0 24 24"><path d="M12 2C9 6 4 7 4 12a8 8 0 0 0 16 0c0-5-5-6-8-10zm0 16a6 6 0 0 1-6-6c0-2.6 2.3-3.8 4.6-6.4.5-.6.9-1.1 1.4-1.7.5.6.9 1.1 1.4 1.7C15.7 8.2 18 9.4 18 12a6 6 0 0 1-6 6z"/></svg></span>
      <span><b>Le fonctionnement des êtres vivants</b><span>SVT · 5ᵉ · chapitre 2</span></span>
    </button>
    <div class="xp" id="xp" title="Tes points"><svg viewBox="0 0 24 24"><path d="m12 2 2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg><span id="xp-val">0</span></div>
    <button class="icobtn" id="theme" aria-label="Changer le thème"><svg viewBox="0 0 24 24" id="theme-ico"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5 2 3h-4l2-3zm0 20-2-3h4l-2 3zM2 12l3-2v4l-3-2zm20 0-3 2v-4l3 2zM5 5l3.5 1L6 8.5 5 5zm14 14-3.5-1 2.5-2.5L19 19zM19 5l-1 3.5L15.5 6 19 5zM5 19l1-3.5L8.5 18 5 19z"/></svg></button>
  </div>
</header>

<main class="wrap" id="app"></main>
<canvas id="conf"></canvas>
<footer>Fais et refais les jeux : on retient mieux en se testant qu’en relisant.</footer>

<script>
"use strict";
/* ==================================================================
   1. CONTENU DU CHAPITRE
   ================================================================== */
const PARTIES = [
  {
    id:"p1", titre:"Se nourrir", sous:"activités 1 et 2",
    couleur:"linear-gradient(130deg,#1E8449,#0F6B58)",
    icone:'<path d="M12 2a9 9 0 0 0-9 9c0 5 4 9 9 11 5-2 9-6 9-11a9 9 0 0 0-9-9zm0 4c2 2 3 4 3 6a3 3 0 0 1-6 0c0-2 1-4 3-6z"/>',
    modules:[
      {
        id:"m1", type:"qcm", titre:"Les régimes alimentaires", sous:"8 questions", xp:16,
        items:[
          {q:"Un animal qui ne mange que des végétaux est…", o:["phytophage","zoophage","omnivore"], r:0,
           e:"Phyto- veut dire « plante ». Le koala, le toucan et le colibri sont des phytophages."},
          {q:"Le koala se nourrit de feuilles d’eucalyptus. Il est…", o:["granivore","folivore","piscivore"], r:1,
           e:"Folivore : il mange des feuilles. C’est un régime précis à l’intérieur des phytophages."},
          {q:"Le martin-pêcheur attrape des poissons. Il est…", o:["insectivore","hématophage","piscivore"], r:2,
           e:"Piscivore : il mange des poissons. Son bec long et pointu est une adaptation à ce régime."},
          {q:"Le sanglier mange des végétaux ET des animaux. Il est…", o:["omnivore","zoophage","phytophage"], r:0,
           e:"Omnivore : il mange de tout. L’ours brun, le corbeau et l’être humain aussi."},
          {q:"Le bec long et fin du colibri lui permet d’atteindre le nectar. C’est…", o:["un régime","une adaptation","une espèce"], r:1,
           e:"Une adaptation : une partie du corps qui permet de se nourrir de ce qu’on trouve dans son milieu."},
          {q:"Le chardonneret se nourrit de graines. Il est…", o:["granivore","frugivore","nectarivore"], r:0,
           e:"Granivore. Frugivore = fruits, nectarivore = nectar."},
          {q:"Des dents plates et larges servent surtout à…", o:["couper la viande","broyer les végétaux","percer la peau"], r:1,
           e:"Les molaires larges broient les feuilles. Les dents pointues, elles, coupent la viande."},
          {q:"Un animal hématophage se nourrit…", o:["de graines","d’insectes","de sang"], r:2,
           e:"Hémato- veut dire « sang ». Exemple : la chauve-souris vampire."}
        ]
      },
      {
        id:"m2", type:"tri", titre:"Classe les animaux", sous:"12 animaux à ranger", xp:20,
        consigne:"Touche un animal, puis touche le groupe où il va.",
        bins:[
          {id:"phy", nom:"Phytophages", sous:"mangent des végétaux", c:"var(--vert)"},
          {id:"zoo", nom:"Zoophages", sous:"mangent des animaux", c:"var(--rouge)"},
          {id:"omn", nom:"Omnivores", sous:"mangent de tout", c:"var(--jaune)"}
        ],

/* ==================================================================
   2. ÉTAT ET STOCKAGE
   ================================================================== */
const CLE = "svt5-ch2-progres";
let etat = { xp:0, mods:{} };
function charger(){
  try{ const v = localStorage.getItem(CLE); if(v) etat = Object.assign(etat, JSON.parse(v)); }
  catch(e){ /* stockage indisponible : on continue sans sauvegarde */ }
}
function sauver(){
  try{ localStorage.setItem(CLE, JSON.stringify(etat)); }catch(e){}
}
charger();

const TOUS = [];
PARTIES.forEach(p => p.modules.forEach(m => TOUS.push(m)));
TOUS.push(CONTROLE);

/* ==================================================================
   3. OUTILS
   ================================================================== */
const app = document.getElementById("app");
const el = (t, c, h) => { const n = document.createElement(t); if(c) n.className = c; if(h !== undefined) n.innerHTML = h; return n; };
const melanger = a => { const b = a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const majXP = () => { document.getElementById("xp-val").textContent = etat.xp; };
function gagner(modId, pct, xp){
  const av = etat.mods[modId];
  if(!av || av.pct < pct){
    if(!av) etat.xp += Math.round(xp * pct / 100);
    else etat.xp += Math.round(xp * (pct - av.pct) / 100);
    etat.mods[modId] = { pct: pct };
    sauver(); majXP();
  }
}
const xpTotal = () => TOUS.reduce((s,m)=>s+m.xp,0);
function progresGlobal(){
  let f = 0; TOUS.forEach(m => { const v = etat.mods[m.id]; if(v) f += v.pct * m.xp; });
  return Math.round(f / xpTotal());
}

/* ---------- confettis ---------- */
const cv = document.getElementById("conf"), ctx = cv.getContext("2d");
let parts = [], anim = null;
function confettis(){
  cv.width = innerWidth; cv.height = innerHeight; cv.style.display = "block";
  const cols = ["#D2691E","#B03A2E","#1E8449","#2E5C8A","#D68910","#1F7A6E"];
  parts = Array.from({length:110}, () => ({
    x: innerWidth/2 + (Math.random()-.5)*260, y: innerHeight*.32,
    vx:(Math.random()-.5)*9, vy: Math.random()*-11-3, r: Math.random()*6+3,
    c: cols[Math.floor(Math.random()*cols.length)], a: Math.random()*Math.PI, va:(Math.random()-.5)*.3
  }));
  if(anim) cancelAnimationFrame(anim);
  const pas = () => {
    ctx.clearRect(0,0,cv.width,cv.height);
    let vivants = 0;
    parts.forEach(p => {
      p.vy += .34; p.x += p.vx; p.y += p.vy; p.a += p.va;
      if(p.y < cv.height + 40) vivants++;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
      ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6); ctx.restore();
    });
    if(vivants) anim = requestAnimationFrame(pas);
    else { cv.style.display = "none"; ctx.clearRect(0,0,cv.width,cv.height); }
  };
  pas();
}

function accueil(){
  app.innerHTML = "";

  h.innerHTML = '<span class="kicker">Chapitre 2 · SVT 5ᵉ</span>' +
    '<h1>Entraîne-toi, teste-toi, révise</h1>' +
    '<p>Onze jeux et un contrôle blanc pour revoir tout le chapitre : se nourrir, respirer, se reproduire.</p>';
  app.appendChild(h);

  const pct = progresGlobal(), C = 2*Math.PI*27;
  const o = el("div","overall");
  o.innerHTML =
    '<div class="ring"><svg width="62" height="62"><circle class="bgc" cx="31" cy="31" r="27"></circle>' +
    '<circle class="fgc" cx="31" cy="31" r="27" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C-C*pct/100)+'"></circle></svg>' +
    '<b>'+pct+'%</b></div>' +
    '<div class="txt"><b>'+(pct===0?"C’est parti !":pct<50?"Bon début, continue":pct<85?"Tu avances bien":"Chapitre maîtrisé, bravo !")+'</b>' +
    '<span>'+Object.keys(etat.mods).length+' jeu(x) sur '+TOUS.length+' commencé(s) · '+etat.xp+' points</span></div>';
  if(pct > 0){
    const rz = el("button","btn ghost","Repartir de zéro");
    rz.onclick = () => { if(confirm("Effacer toute ta progression ?")){ etat = {xp:0,mods:{}}; sauver(); majXP(); accueil(); } };
    o.appendChild(rz);
  }
  app.appendChild(o);

  const g = el("div","grid");
  PARTIES.forEach(p => {
    const c = el("div","card");
    const top = el("div","top");
    top.style.background = p.couleur;
    top.innerHTML = '<svg viewBox="0 0 24 24">'+p.icone+'</svg><span><b>'+p.titre+'</b><i>'+p.sous+'</i></span>';
    c.appendChild(top);
    const b = el("div","body");
    p.modules.forEach(m => b.appendChild(ligneModule(m)));
    c.appendChild(b); g.appendChild(c);
  });

  const c = el("div","card");
  const top = el("div","top");
  top.style.background = "linear-gradient(130deg,#D2691E,#B03A2E)";
  top.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 2h6a2 2 0 0 1 2 2v1h2a1 1 0 0 1 1 1v13a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V6a1 1 0 0 1 1-1h2V4a2 2 0 0 1 2-2zm0 8v2h6v-2zm0 4v2h6v-2z"/></svg>' +
    '<span><b>Le grand test</b><i>quand tu te sens prêt</i></span>';
  c.appendChild(top);
  const b = el("div","body");
  b.appendChild(ligneModule(CONTROLE));
  c.appendChild(b); g.appendChild(c);

  app.appendChild(g);
  majXP();
}
function ligneModule(m){
  const v = etat.mods[m.id];
  const btn = el("button","mod" + (v && v.pct >= 80 ? " done" : ""));
  const ico = { qcm:"?", tri:"⇄", ordre:"1·2", trous:"✎", flash:"↻" }[m.type] || "?";
  btn.innerHTML = '<span class="dot">'+(v && v.pct>=80 ? "✓" : ico)+'</span>' +
    '<span class="lbl"><b>'+m.titre+'</b><span>'+m.sous+'</span></span>' +
    (v ? '<span class="score-pill">'+v.pct+'%</span>' : '') + '<span class="go"></span>';
  btn.onclick = () => ouvrir(m);
  return btn;
}

  b.onclick = accueil;
  h.appendChild(b);
  h.appendChild(el("div","t","<b>"+m.titre+"</b><span>"+(sousTitre||m.sous)+"</span>"));
  app.appendChild(h);
  const s = el("div","steps",'<i style="width:0%"></i>');
  app.appendChild(s);
  const p = el("div","panel");
  app.appendChild(p);
  return { panneau:p, barre:s.firstChild };
}
function ouvrir(m){
  scrollTo({top:0,behavior:"smooth"});
  if(m.type === "qcm") jeuQcm(m);
  else if(m.type === "tri") jeuTri(m);
  else if(m.type === "ordre") jeuOrdre(m);
  else if(m.type === "trous") jeuTrous(m);
  else if(m.type === "flash") jeuFlash(m);
}

/* ==================================================================
   6. QCM
   ================================================================== */
function jeuQcm(m){
  const qs = m.melange ? melanger(m.items) : m.items;
  let i = 0, bons = 0; const revue = [];
  const { panneau, barre } = cadre(m, qs.length + " questions");
  const etape = () => {
    barre.style.width = (i / qs.length * 100) + "%";
    const q = qs[i];
    panneau.innerHTML = "";
    panneau.style.animation = "none"; void panneau.offsetWidth; panneau.style.animation = "";
    panneau.appendChild(el("div","qnum","Question " + (i+1) + " / " + qs.length));
    panneau.appendChild(el("div","qtxt", q.q));
    const opts = el("div","opts");
    const lettres = ["A","B","C","D"];
    q.o.forEach((txt, k) => {
      const o = el("button","opt",'<span class="k">'+lettres[k]+'</span><span>'+txt+'</span>');
      o.onclick = () => repondre(k);
      opts.appendChild(o);
    });
    panneau.appendChild(opts);
    const fb = el("div","feedback"); panneau.appendChild(fb);
    const act = el("div","actions"); panneau.appendChild(act);

    function repondre(k){
      const boutons = [...opts.children];
      boutons.forEach((b,idx) => { b.disabled = true; if(idx === q.r) b.classList.add("good"); });
      const juste = k === q.r;
      if(juste) bons++; else boutons[k].classList.add("bad");
      revue.push({ q:q.q, ok:juste, e:q.e, bonne:q.o[q.r] });
      fb.className = "feedback show " + (juste ? "ok" : "ko");
      fb.innerHTML = "<b>" + (juste ? "Bien vu !" : "Pas tout à fait — la bonne réponse est « " + q.o[q.r] + " »") + "</b>" + q.e;
      const n = el("button","btn", i < qs.length-1 ? "Question suivante" : "Voir mon résultat");
      n.onclick = () => { i++; if(i < qs.length) etape(); else fin(); };
      act.appendChild(n); n.focus();
    }
  };
  const fin = () => {
    barre.style.width = "100%";
    resultat(m, Math.round(bons / qs.length * 100), bons + " bonnes réponses sur " + qs.length, revue);
  };
  etape();
}

/* ==================================================================
   7. JEU DE TRI
   ================================================================== */
function jeuTri(m){
  const { panneau, barre } = cadre(m);
  const items = melanger(m.items).map((x,i) => ({...x, uid:"i"+i, place:null}));
  let choisi = null, erreurs = 0, message = null, rate = null;
  const nomBin = id => m.bins.find(b => b.id === id).nom;

  const dessiner = () => {
    panneau.innerHTML = "";
    panneau.appendChild(el("p","hint", m.consigne + " Une erreur ne reste jamais affichée : l’étiquette revient en haut."));

    const pool = el("div","pool");
    items.filter(x => !x.place).forEach(x => {
      const c = el("button","chip" + (choisi === x.uid ? " sel" : "") + (rate === x.uid ? " wrong" : ""), x.t);
      c.onclick = () => { choisi = (choisi === x.uid ? null : x.uid); message = null; rate = null; dessiner(); };
      pool.appendChild(c);
    });
    panneau.appendChild(pool);

    if(message){
      const fb = el("div","feedback show ko","<b>Ce n’est pas le bon groupe.</b>" + message);
      panneau.appendChild(fb);
    }

    const bins = el("div","bins");
    m.bins.forEach(b => {
      const box = el("div","bin" + (choisi ? " armed" : ""));
      if(choisi) box.style.borderColor = b.c;
      box.innerHTML = '<b style="color:'+b.c+'">'+b.nom+'<br><span style="font-weight:400;font-size:12px;color:var(--muted)">'+b.sous+'</span></b>';
      const its = el("div","items");
      items.filter(x => x.place === b.id).forEach(x => its.appendChild(el("span","chip placed right", x.t)));
      box.appendChild(its);
      box.onclick = () => {
        if(!choisi) return;
        const x = items.find(y => y.uid === choisi);
        if(x.b === b.id){ x.place = b.id; choisi = null; message = null; rate = null; }
        else { erreurs++; message = "« " + x.t + " » ne va pas dans « " + b.nom + " ». Il va dans « " + nomBin(x.b) + " »… à toi de le retrouver."; rate = x.uid; choisi = null; }
        dessiner();
      };
      bins.appendChild(box);
    });
    panneau.appendChild(bins);

    const faits = items.filter(x => x.place).length;
    barre.style.width = (faits / items.length * 100) + "%";
    if(faits === items.length){
      const pct = Math.max(20, Math.round(100 * items.length / (items.length + erreurs)));
      const fb = el("div","feedback show ok",
        "<b>Tout est rangé, et tout est juste.</b>" + (erreurs ? erreurs + " essai(s) à côté en chemin." : "Sans aucune erreur."));
      panneau.appendChild(fb);
      const act = el("div","actions"); panneau.appendChild(act);
      const sv = el("button","btn","Voir mon résultat");
      sv.onclick = () => resultat(m, pct, erreurs ? erreurs + " erreur(s) avant de tout ranger" : "Tout juste du premier coup");
      act.appendChild(sv);
      const r = el("button","btn ghost","Recommencer"); r.onclick = () => jeuTri(m); act.appendChild(r);
    }
  };
  dessiner();
}

/* ==================================================================
   8. REMISE EN ORDRE
   ================================================================== */
function jeuOrdre(m){
  const { panneau, barre } = cadre(m);
  const reste = melanger(m.etapes.map((t,i) => ({t, i})));
  const places = []; let erreurs = 0;
  const dessiner = () => {
    panneau.innerHTML = "";
    panneau.appendChild(el("p","hint", m.consigne));
    const ord = el("div","order");
    m.etapes.forEach((t, n) => {
      const l = el("div","slotline");
      l.appendChild(el("span","slotnum", String(n+1)));
      const s = el("div","slot" + (places[n] !== undefined ? " filled" : ""), places[n] !== undefined ? m.etapes[places[n]] : "…");
      l.appendChild(s); ord.appendChild(l);
    });
    panneau.appendChild(ord);
    const pool = el("div","pool");
    pool.style.marginTop = "18px";
    reste.forEach(x => {
      const c = el("button","chip", x.t);
      c.onclick = () => {
        const n = places.length;
        if(x.i === n){
          places.push(x.i); reste.splice(reste.indexOf(x),1);
          if(!reste.length){ barre.style.width = "100%"; fin(); return; }
        } else { erreurs++; c.classList.add("wrong"); setTimeout(()=>c.classList.remove("wrong"),500); }
        barre.style.width = (places.length / m.etapes.length * 100) + "%";
        dessiner();
      };
      pool.appendChild(c);
    });
    panneau.appendChild(pool);
  };
  const fin = () => {
    const pct = Math.max(20, 100 - erreurs * 20);
    resultat(m, pct, erreurs === 0 ? "Sans aucune erreur !" : erreurs + " erreur(s) avant de trouver l’ordre");
  };
  dessiner();
}

/* ==================================================================
   9. TEXTE À TROUS
   ================================================================== */
function jeuTrous(m){
  const { panneau, barre } = cadre(m);
  const dispo = melanger(m.mots);
  const rep = {}; let choisi = null, erreurs = 0, message = null, rate = null;
  const trous = m.texte.filter(x => typeof x === "object");

  const dessiner = () => {
    panneau.innerHTML = "";
    panneau.appendChild(el("p","hint", m.consigne + " Un mot mal placé ne reste pas dans la phrase : il revient en haut."));

    const pool = el("div","pool");
    dispo.forEach(mot => {
      if(Object.values(rep).includes(mot)) return;
      const c = el("button","chip" + (choisi === mot ? " sel" : "") + (rate === mot ? " wrong" : ""), mot);
      c.onclick = () => { choisi = (choisi === mot ? null : mot); message = null; rate = null; dessiner(); };
      pool.appendChild(c);
    });
    panneau.appendChild(pool);

    if(message) panneau.appendChild(el("div","feedback show ko","<b>Pas à cet endroit.</b>" + message));

    const p = el("p","cloze");
    let k = 0;
    m.texte.forEach(part => {
      if(typeof part === "string"){ p.appendChild(document.createTextNode(part)); return; }
      const n = k++;
      const rempli = rep[n] !== undefined;
      const b = el("span", "blank" + (rempli ? " right" : (choisi ? " armed" : "")), rempli ? rep[n] : "………");
      if(!rempli) b.onclick = () => {
        if(!choisi) return;
        if(choisi === part.b){ rep[n] = choisi; choisi = null; message = null; rate = null; }
        else { erreurs++; message = "« " + choisi + " » ne convient pas ici : relis la phrase en entier avant de choisir."; rate = choisi; choisi = null; }
        dessiner();
      };
      p.appendChild(b);
    });
    panneau.appendChild(p);

    const faits = Object.keys(rep).length;
    barre.style.width = (faits / trous.length * 100) + "%";
    if(faits === trous.length){
      const pct = Math.max(20, Math.round(100 * trous.length / (trous.length + erreurs)));
      panneau.appendChild(el("div","feedback show ok",
        "<b>Le bilan est complet, et il est juste.</b>" + (erreurs ? erreurs + " essai(s) à côté en chemin." : "Sans aucune erreur.")));
      const act = el("div","actions"); panneau.appendChild(act);
      const sv = el("button","btn","Voir mon résultat");
      sv.onclick = () => resultat(m, pct, erreurs ? erreurs + " erreur(s) avant de tout placer" : "Tout juste du premier coup");
      act.appendChild(sv);
      const r = el("button","btn ghost","Recommencer"); r.onclick = () => jeuTrous(m); act.appendChild(r);
    }
  };
  dessiner();
}

/* ==================================================================
   10. CARTES MÉMO
   ================================================================== */
function jeuFlash(m){
  const cartes = melanger(m.cartes);
  let i = 0, su = 0;
  const { panneau, barre } = cadre(m, cartes.length + " mots");
  const dessiner = () => {
    barre.style.width = (i / cartes.length * 100) + "%";
    panneau.innerHTML = "";
    panneau.appendChild(el("div","qnum","Carte " + (i+1) + " / " + cartes.length));
    const w = el("div","flashwrap");
    const f = el("div","flash");
    f.innerHTML = '<div class="face front"><div><div class="mot">'+cartes[i][0]+'</div><small>touche la carte pour voir la définition</small></div></div>' +
      '<div class="face back"><div><div class="def">'+cartes[i][1]+'</div><small>'+cartes[i][0]+'</small></div></div>';
    let retournee = false;
    f.onclick = () => { retournee = !retournee; f.classList.toggle("turned"); act.style.visibility = retournee ? "visible" : "hidden"; };
    w.appendChild(f); panneau.appendChild(w);
    panneau.appendChild(el("p","hint","Essaie de dire la définition à voix haute avant de retourner la carte."));
    const act = el("div","actions");
    act.style.visibility = "hidden";
    const ok = el("button","btn","Je la savais");
    ok.onclick = () => { su++; suivant(); };
    const ko = el("button","btn ghost","À revoir");
    ko.onclick = suivant;
    act.appendChild(ok); act.appendChild(ko);
    panneau.appendChild(act);
  };
  const suivant = () => { i++; if(i < cartes.length) dessiner(); else {
    barre.style.width = "100%";
    resultat(m, Math.round(su / cartes.length * 100), su + " mot(s) su(s) sur " + cartes.length);
  }};
  dessiner();
}

/* ==================================================================
   11. RÉSULTAT
   ================================================================== */
function resultat(m, pct, phrase, revue){
  gagner(m.id, pct, m.xp);
  scrollTo({top:0,behavior:"smooth"});
  app.innerHTML = "";
  const h = el("div","mhead");
  const b = el("button","back");
  b.setAttribute("aria-label","Retour");
  b.innerHTML = '<svg viewBox="0 0 24 24"><path d="M15.4 4.6 8 12l7.4 7.4 1.4-1.4L10.8 12l6-6z"/></svg>';
  b.onclick = accueil;
  h.appendChild(b);
  h.appendChild(el("div","t","<b>"+m.titre+"</b><span>résultat</span>"));
  app.appendChild(h);

  const p = el("div","panel result");
  const medal = pct >= 90 ? "🏆" : pct >= 70 ? "🎉" : pct >= 50 ? "💪" : "🔁";
  const mot = pct >= 90 ? "Excellent !" : pct >= 70 ? "Bien joué !" : pct >= 50 ? "C’est en bonne voie" : "On recommence ?";
  p.innerHTML = '<div class="medal">'+medal+'</div><h2>'+mot+'</h2>' +
    '<div class="bigscore">'+pct+'%</div><p>'+phrase+'</p>';
  const act = el("div","actions");
  act.style.justifyContent = "center";
  const r = el("button","btn","Refaire ce jeu");
  r.onclick = () => ouvrir(m);
  const a = el("button","btn ghost","Retour aux jeux");
  a.onclick = accueil;
  act.appendChild(r); act.appendChild(a);
  p.appendChild(act);

  if(revue && revue.some(x => !x.ok)){
    const rv = el("div","revue");
    rv.appendChild(el("h3","","À revoir"));
    revue.filter(x => !x.ok).forEach(x => {
      rv.appendChild(el("div","rev ko","<b>"+x.q+"</b>Réponse : "+x.bonne+". "+x.e));
    });
    p.appendChild(rv);
  }
  app.appendChild(p);
  if(pct >= 80) confettis();
}

/* ==================================================================
   12. THÈME ET DÉMARRAGE
   ================================================================== */
const btnTheme = document.getElementById("theme");
function appliquerTheme(t){
  if(t) document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
  try{ if(t) localStorage.setItem("svt5-theme", t); else localStorage.removeItem("svt5-theme"); }catch(e){}
}
try{ const t = localStorage.getItem("svt5-theme"); if(t) appliquerTheme(t); }catch(e){}
btnTheme.onclick = () => {
  const sombreSys = matchMedia("(prefers-color-scheme: dark)").matches;
  const actuel = document.documentElement.getAttribute("data-theme") || (sombreSys ? "dark" : "light");
  appliquerTheme(actuel === "dark" ? "light" : "dark");
};
document.getElementById("home-btn").onclick = accueil;
addEventListener("resize", () => { if(cv.style.display === "block"){ cv.width = innerWidth; cv.height = innerHeight; } });
majXP();
accueil();
